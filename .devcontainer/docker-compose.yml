services:
  firmware:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USERNAME: ${USERNAME:-developer}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        IDF_VERSION: ${IDF_VERSION:-release-v5.4}

    container_name: rccar-firmware
    privileged: true
    network_mode: host

    volumes:
      - /dev:/dev
      - ..:/workspaces/firmware:cached
      - ${HOME}/.ssh:/home/${USERNAME:-developer}/.ssh:ro

    environment:
      - TERM=xterm-256color
      - IDF_EXPORT_QUIET=1

    command: /bin/sh -c "while sleep 1000; do :; done"
